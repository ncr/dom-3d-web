<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dom Becelów · Radostowice</title>
<style id="gate-style">
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; font-family: system-ui, sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, #1b2433 0%, #0e1218 60%);
    color: #e8edf2;
  }
  .card {
    width: min(340px, calc(100vw - 32px)); padding: 28px 26px;
    background: rgba(17, 21, 27, .85); backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .1); border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
  }
  .card h1 { font-size: 17px; margin-bottom: 4px; }
  .card p { font-size: 12.5px; color: #9aa7b4; margin-bottom: 18px; }
  input[type="password"] {
    width: 100%; padding: 12px 12px; font-size: 16px; border-radius: 11px;
    border: 1px solid rgba(255, 255, 255, .18); background: #232a33; color: #e8edf2;
  }
  label { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: #9aa7b4; margin: 12px 0 16px; }
  button {
    width: 100%; padding: 12px; font-size: 15px; border: none; border-radius: 11px;
    background: #3d6fb4; color: #fff; cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: .6; }
  #err { color: #ff8a8a; font-size: 12.5px; margin-top: 10px; display: none; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>Dom Becelów</h1>
    <p>Radostowice · Czarkowska 26N</p>
    <input id="pass" type="password" autocomplete="current-password" placeholder="hasło" autofocus />
    <label><input id="remember" type="checkbox" checked /> zapamiętaj na tym urządzeniu</label>
    <button id="go" disabled>Ładowanie…</button>
    <div id="err"></div>
  </form>
<script type="module">
document.getElementById('f').addEventListener('submit', (event) => event.preventDefault());
const nativeFetch=window.fetch.bind(window);
const META = await nativeFetch('./crypt-meta.json', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error('Nie udało się pobrać konfiguracji.'); return r.json(); });
const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64e = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));

async function deriveKey(pass) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64d(META.salt), iterations: META.iter, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function decrypt(key, url) {
  const response=await nativeFetch(url,{cache:'no-cache'});
  if(!response.ok)throw new Error(`Nie udało się pobrać strony (${response.status}).`);
  const buf = new Uint8Array(await response.arrayBuffer());
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
}

// Use IndexedDB independently of HTTP and service-worker caches.
// Store only ciphertext; all callers still authenticate and decrypt every read.
async function openAssetCache(name){
  const db=await new Promise((resolve,reject)=>{
    const request=indexedDB.open(name,1);let abandoned=false;
    const timer=setTimeout(()=>{abandoned=true;resolve(null);},2500);
    request.onupgradeneeded=()=>request.result.createObjectStore('assets');
    request.onsuccess=()=>{clearTimeout(timer);if(abandoned)request.result.close();else resolve(request.result);};
    request.onerror=()=>{clearTimeout(timer);reject(request.error);};
    request.onblocked=()=>{clearTimeout(timer);abandoned=true;resolve(null);};
  });
  if(!db)return null;
  db.onversionchange=()=>db.close();
  const run=(mode,action)=>new Promise((resolve,reject)=>{
    const tx=db.transaction('assets',mode),request=action(tx.objectStore('assets'));
    tx.oncomplete=()=>resolve(request.result);
    tx.onabort=tx.onerror=()=>reject(tx.error||new Error('Asset cache unavailable'));
  });
  return {
    async match(url){const bytes=await run('readonly',s=>s.get(url));return bytes?new Response(bytes):undefined;},
    async put(url,response){const bytes=await response.arrayBuffer();await run('readwrite',s=>s.put(bytes,url));},
    delete:url=>run('readwrite',s=>s.delete(url)),
    async keys(){return (await run('readonly',s=>s.getAllKeys())).map(url=>({url}));},
  };
}

function assetLoader(key,manifest){
  const stats=window.__assetCacheStats={hits:0,downloads:0,downloadBytes:0,cacheErrors:0};
  const cacheName='dom-3d-assets-v1:'+new URL('.',location.href).pathname;
  const cachePromise=openAssetCache(cacheName).catch(()=>{stats.cacheErrors++;return null;});
  const pending=new Map();
  const decryptBytes=bytes=>crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},key,bytes.slice(12));
  async function load(path){
    const logical='./'+path.replace(/^\.\//,''),entry=manifest[logical];
    if(!entry)return decrypt(key,logical+'.enc'); // Existing pre-manifest deployments.
    const url=new URL(entry.url,location.href).href,cache=await cachePromise;
    if(cache){
      try{
        const hit=await cache.match(url);
        if(hit){const plain=await decryptBytes(new Uint8Array(await hit.arrayBuffer()));stats.hits++;return plain;}
      }catch{stats.cacheErrors++;try{await cache.delete(url);}catch{}}
    }
    const response=await nativeFetch(url,{cache:'force-cache'});
    if(!response.ok)throw new Error(`Nie udało się pobrać zasobu (${response.status}).`);
    const bytes=new Uint8Array(await response.arrayBuffer());
    const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(n=>n.toString(16).padStart(2,'0')).join('');
    if(hash!==entry.hash)throw new Error('Niepełny zasób — odśwież stronę, aby spróbować ponownie.');
    const plain=await decryptBytes(bytes);
    stats.downloads++;stats.downloadBytes+=bytes.length;
    if(cache){try{await cache.put(url,new Response(bytes,{headers:{'Content-Type':'application/octet-stream'}}));}catch{stats.cacheErrors++;}}
    return plain;
  }
  const get=path=>{
    if(!pending.has(path))pending.set(path,load(path).finally(()=>pending.delete(path)));
    return pending.get(path);
  };
  // Keep only this deployment's resources; a quota/storage denial never prevents loading.
  get.prune=async()=>{
    try{const cache=await cachePromise;if(!cache)return;const keep=new Set(Object.values(manifest).map(e=>new URL(e.url,location.href).href));
      for(const request of await cache.keys())if(!keep.has(request.url))await cache.delete(request.url);
    }catch{stats.cacheErrors++;}
  };
  return get;
}

async function boot(key, onUnlocked) {
  const pageBuf = await decrypt(key, './page.enc');
  await onUnlocked?.();
  const doc = new DOMParser().parseFromString(new TextDecoder().decode(pageBuf), 'text/html');
  const manifest=JSON.parse(doc.querySelector('#encrypted-assets')?.textContent||'{}');
  const load=assetLoader(key,manifest);
  const entry = [...doc.querySelectorAll('script[src]')].map(s=>s.getAttribute('src')).find(s=>/assets\/.+\.js$/.test(s));
  if(!entry)throw new Error('Brak pliku aplikacji.');
  const sheets=[...doc.querySelectorAll('link[rel="stylesheet"]')].map(s=>s.getAttribute('href'));
  const [js,...styles]=await Promise.all([load(entry),...sheets.map(load)]);
  window.__cryptKey=key;window.__cryptDecrypt=load;
  document.title = doc.title;
  document.getElementById('gate-style')?.remove();
  document.querySelector('meta[name="viewport"]').content = doc.querySelector('meta[name="viewport"]').content;
  for (const st of doc.querySelectorAll('style')) document.head.appendChild(st.cloneNode(true));
  for(const css of styles){const st=document.createElement('style');st.textContent=new TextDecoder().decode(css);document.head.appendChild(st);}
  doc.querySelectorAll('script').forEach(s=>s.remove());
  document.body.innerHTML = doc.body.innerHTML;
  document.body.style.background = '';
  document.body.style.display = '';
  const blob = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
  try{await import(blob);}finally{URL.revokeObjectURL(blob);}
  if(Object.keys(manifest).length)void load.prune();
}

// Storage can be disabled by the browser; unlocking must still work.
function storage(kind, action, value) {
  try { return window[kind][action]('crypt-key', value); } catch { return null; }
}
const saved = storage('sessionStorage', 'getItem') || storage('localStorage', 'getItem');
if (saved) {
  try {
    const key = await crypto.subtle.importKey('raw', b64d(saved), 'AES-GCM', true, ['decrypt']);
    await boot(key);
  } catch (error) {
    // A network or application error does not mean the saved key is invalid.
    if (['OperationError', 'DataError', 'InvalidCharacterError'].includes(error.name)) {
      storage('sessionStorage', 'removeItem');
      storage('localStorage', 'removeItem');
    }
  }
}

document.getElementById('f')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Odszyfrowywanie…'; err.style.display = 'none';
  try {
    const key = await deriveKey(document.getElementById('pass').value);
    const remember = document.getElementById('remember').checked;
    await boot(key, async () => {
      const raw = b64e(await crypto.subtle.exportKey('raw', key));
      storage('sessionStorage', 'setItem', raw);
      if (remember) storage('localStorage', 'setItem', raw);
      else storage('localStorage', 'removeItem');
    });
  } catch (error) {
    err.textContent = error.name==='OperationError'?'Nieprawidłowe hasło.':'Nie udało się załadować strony. Sprawdź połączenie i spróbuj ponownie.';
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Wejdź';
  }
});
const readyButton = document.getElementById('go');
if (readyButton) { readyButton.disabled = false; readyButton.textContent = 'Wejdź'; }
</script>
</body>
</html>
